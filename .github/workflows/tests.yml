name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # Python est installé par uv : Ubuntu 26.04 (ubuntu-latest) ne fournit plus 3.9
      # à actions/setup-python. L'environnement .venv est créé et activé pour la suite.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Installation
        run: uv pip install -e ".[dev]"
      - name: Tests
        run: |
          python --version
          python -m pytest -q
